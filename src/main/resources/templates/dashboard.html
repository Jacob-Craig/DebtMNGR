<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DebtMNGR - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <a href="/" class="text-xl font-bold tracking-tight text-indigo-600 hover:text-indigo-700">
                        DebtMNGR
                    </a>
                </div>
                <div>
                    <a href="/groups/new"
                       class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        + Create Group
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Your Groups</h1>
                <p class="text-sm text-gray-500 mt-1">Manage shared expenses and debt settlements across your active groups.</p>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(groups)}" class="text-center py-16 px-4 bg-white rounded-lg border-2 border-dashed border-gray-300">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            <h3 class="mt-4 text-lg font-medium text-gray-900">No groups yet</h3>
            <p class="mt-1 text-sm text-gray-500">Get started by creating your first group to track and split expenses with friends or housemates.</p>
            <div class="mt-6">
                <a href="/groups/new"
                   class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Create Group
                </a>
            </div>
        </div>

        <!-- Group Cards Grid -->
        <div th:unless="${#lists.isEmpty(groups)}" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div th:each="group : ${groups}"
                 class="bg-white overflow-hidden shadow rounded-lg border border-gray-200 hover:shadow-md transition-shadow duration-200">
                <div class="p-6">
                    <h2 class="text-lg font-semibold text-gray-900 truncate" th:text="${group.name}">Group Name</h2>
                    <p class="mt-2 text-sm text-gray-600 line-clamp-2"
                       th:text="${group.description ?: 'No description provided.'}">Group Description</p>
                </div>
                <div class="bg-gray-50 px-6 py-3 border-t border-gray-100 flex justify-between items-center text-xs text-gray-500">
                    <span class="text-gray-400">Group</span>
                    <a th:href="@{/groups/{id}(id=${group.id})}" class="font-medium text-indigo-600 hover:text-indigo-500">
                        View Group &rarr;
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
