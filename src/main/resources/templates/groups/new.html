<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DebtMNGR - Create Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <a href="/" class="text-xl font-bold tracking-tight text-indigo-600 hover:text-indigo-700">
                        DebtMNGR
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="mb-6">
            <a href="/" class="text-sm font-medium text-indigo-600 hover:text-indigo-500 flex items-center gap-1">
                &larr; Back to Dashboard
            </a>
            <h1 class="text-2xl font-bold text-gray-900 mt-2">Create a New Group</h1>
            <p class="text-sm text-gray-500 mt-1">Set up a group to track shared expenses for a trip, household, or event.</p>
        </div>

        <div class="bg-white shadow sm:rounded-lg border border-gray-200 p-6">
            <form th:action="@{/groups}" th:object="${groupForm}" method="post" class="space-y-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">
                        Group Name <span class="text-red-500">*</span>
                    </label>
                    <div class="mt-1">
                        <input type="text"
                               id="name"
                               th:field="*{name}"
                               placeholder="e.g. Apartment 4B, Trip to Spain"
                               class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border"
                               th:classappend="${#fields.hasErrors('name')} ? 'border-red-300 focus:border-red-500 focus:ring-red-500' : 'border-gray-300'" />
                    </div>
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-sm text-red-600">
                        Group name error
                    </p>
                </div>

                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700">
                        Description <span class="text-gray-400 font-normal">(optional)</span>
                    </label>
                    <div class="mt-1">
                        <textarea id="description"
                                  th:field="*{description}"
                                  rows="3"
                                  placeholder="What are the shared expenses for?"
                                  class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border"
                                  th:classappend="${#fields.hasErrors('description')} ? 'border-red-300 focus:border-red-500 focus:ring-red-500' : 'border-gray-300'"></textarea>
                    </div>
                    <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="mt-1 text-sm text-red-600">
                        Description error
                    </p>
                </div>

                <div class="flex justify-end items-center gap-3 pt-4 border-t border-gray-100">
                    <a href="/" class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-gray-900 bg-white border border-gray-300 rounded-md shadow-sm hover:bg-gray-50">
                        Cancel
                    </a>
                    <button type="submit"
                            class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 border border-transparent rounded-md shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Create Group
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
